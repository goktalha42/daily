<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zühtü">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zühtü</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FCF9F2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #zuhtu-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #FCF9F2;
      color: #18181B;
      z-index: 9999;
      text-align: center;
      padding: 24px;
    }
    .zuhtu-spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #E5E7EB;
      border-top-color: #18181B;
      border-radius: 50%;
      animation: zuhtu-spin 0.8s linear infinite;
    }
    @keyframes zuhtu-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="zuhtu-loader">
    <div class="zuhtu-spinner"></div>
    <div style="font-weight:800;font-size:20px;">Zühtü yükleniyor...</div>
    <div id="zuhtu-loader-sub" style="font-size:13px;color:#64748B;">Günlük zeka oyunları hazırlanıyor</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('zuhtu-loader');
      if (el) el.remove();
    });
    window.addEventListener('error', function (e) {
      var sub = document.getElementById('zuhtu-loader-sub');
      if (sub && e && e.message) {
        sub.textContent = 'Yükleme uyarısı: ' + e.message;
      }
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
